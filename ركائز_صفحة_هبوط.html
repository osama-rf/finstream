.icon-circle{width:76px;height:76px;border-radius:50%;background:var(--stone2);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s}
.icon-circle svg{width:32px;height:32px;stroke:var(--sand);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.team-member:hover .icon-circle{transform:scale(1.06);border-color:var(--pulse)}
.team-member span:last-child{color:var(--sand)}
</style>
<link href="https://fonts.cdnfonts.com/css/themanyah" rel="stylesheet">
<style>
:root{
  /* نظام الهوية الرسمي — دليل ركائز v2 */
  --navy:#10233F;      /* كحلي الرسوخ — الثقة، الأساس */
  --gold:#C89B3C;       /* ذهبي الواحة — القوة، الإحصاءات */
  --clay:#B5583A;        /* طيني الدرعية — الابتكار، إدارة المخاطر */
  --pulse:#17C3B2;      /* نبض رقمي — الحركة، الوصول لرأس المال */
  --violet:#6D4E9E;      /* بنفسجي الشفق — الذكاء، التدفق النقدي */
  --violet-surface:#EDE7F5; /* سطح فاتح إلزامي خلف البنفسجي (تباين ضعيف على الكحلي) */

  --ink:var(--navy);
  --stone:#16304F;
  --stone2:#1D3D63;
  --sand:#F4EFE6;
  --mist:#8FA0B8;
  --line:rgba(244,239,230,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic',sans-serif;background:var(--ink);color:var(--sand);overflow:hidden;height:100vh;width:100vw}
h1,h2{font-family:'Thmanyah Serif Display','IBM Plex Sans Arabic',sans-serif;line-height:1.3;font-weight:500}
h3,.disp{font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic',sans-serif;line-height:1.4;font-weight:600}

#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2B2850 0%,#221F3D 72%)}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;transition:transform 1.15s cubic-bezier(.66,0,.24,1)}
.frame{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:60px;overflow:hidden}
.frame .inner{max-width:100%}

.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:.82rem;letter-spacing:.1em;font-weight:600;margin-bottom:16px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.eyebrow svg{width:19px;height:19px;flex-shrink:0;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.frame h2{font-size:2.5rem;font-weight:800;margin-bottom:16px;color:var(--sand)}
.frame p{color:var(--mist);font-size:1.05rem;line-height:1.9;font-weight:400;max-width:60ch;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.frame p b{color:var(--sand);font-weight:500}
.en{direction:ltr;unicode-bidi:isolate;font-feature-settings:"tnum"}

#f-core{width:1100px;height:800px;left:0;top:0;align-items:center;text-align:center}
#f-core .logo-mark{display:flex;gap:14px;align-items:flex-end;height:120px;margin-bottom:30px}
#f-core .bar{width:38px;background:var(--stone2);border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:none}
#f-core .bar:nth-child(1){height:55%}
#f-core .bar:nth-child(2){height:78%}
#f-core .bar:nth-child(3){height:100%;background:linear-gradient(180deg,var(--navy),var(--stone2))}
#f-core h1{font-size:4.4rem;font-weight:800;margin-bottom:10px}
#f-core .sub{font-size:1.3rem;color:var(--mist);max-width:46ch;font-weight:400;margin-bottom:8px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
#f-core .kicker{font-size:.85rem;color:var(--gold);letter-spacing:.08em;margin-top:26px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}

.metric{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--gold);font-size:3rem;line-height:1.1;direction:ltr;unicode-bidi:isolate}
.metric.warn{color:var(--gold)}
.metric.risk{color:var(--gold)}
.mlabel{font-size:.9rem;color:var(--mist);margin-top:6px;max-width:34ch;font-weight:400;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.src{font-size:.72rem;color:var(--mist);opacity:.7;margin-top:24px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}

.trio{display:flex;gap:26px;margin-top:26px}
.trio .cell{flex:1}
.chip{display:inline-block;font-size:.72rem;background:var(--violet-surface);color:var(--violet);padding:4px 12px;border-radius:20px;margin-bottom:14px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}

.flow-line{margin-top:14px;font-size:.95rem;color:var(--sand);font-weight:400;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.flow-line span{color:var(--gold);margin:0 5px}

.mini-card{background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.mini-card h3{font-size:1.15rem;color:var(--sand);margin-bottom:8px;font-weight:800}
.mini-card p{font-size:.9rem}
.role{font-size:.75rem;color:var(--gold);margin-bottom:8px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.avatar{font-size:2.4rem;line-height:1;margin-bottom:10px;display:block}

ul.clean{list-style:none;margin-top:10px}
ul.clean li{padding:8px 22px 8px 0;position:relative;font-size:.98rem;color:var(--mist);line-height:1.75;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
ul.clean li::before{content:"";position:absolute;right:0;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
ul.clean li b{color:var(--sand);font-weight:500}

.milestone{background:linear-gradient(180deg,rgba(200,155,60,.16),var(--stone));border:1px solid var(--gold);border-radius:16px;padding:22px 24px}
.milestone .amt{font-family:'Thmanyah Serif Display',serif;font-weight:600;font-size:1.6rem;color:var(--gold)}
.tag-ai{background:var(--violet-surface);color:var(--violet);font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic';font-weight:600;font-size:.72rem;padding:4px 12px;border-radius:20px;display:inline-block}
.risk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:20px}
.risk-item{font-size:.9rem;color:var(--mist);font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.risk-item b{color:var(--gold);font-weight:600;display:block;font-size:.8rem;margin-bottom:2px}

#hud{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:16px;background:rgba(34,31,61,.82);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:40px;padding:9px 20px}
#hud button{background:none;border:none;color:var(--sand);cursor:pointer;font-size:1.3rem;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s}
#hud button:hover{background:var(--stone2)}
#hud button:disabled{opacity:.3;cursor:default}
#hud .track{font-family:'IBM Plex Mono';font-size:.82rem;color:var(--mist);min-width:56px;text-align:center;direction:ltr}
#hud .track b{color:var(--gold)}
#dots{position:fixed;top:50%;left:26px;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:11px}
#dots .dot{width:9px;height:9px;border-radius:50%;background:var(--stone2);border:1px solid var(--line);cursor:pointer;transition:all .3s;padding:0}
#dots .dot.active{background:var(--gold);transform:scale(1.4)}
.label{position:fixed;top:24px;right:30px;z-index:100;font-family:'Thmanyah Serif Text';font-weight:600;font-size:1.2rem;color:var(--sand)}
.hint{position:fixed;bottom:22px;right:30px;z-index:100;font-size:.72rem;color:var(--mist);opacity:.7;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}

/* رمز مؤقت — بديل عن final_logo.png لحين رفع الملف الفعلي */
.logo-column{width:64px;height:110px;position:relative;margin:0 auto 20px}
.logo-column .capital{width:64px;height:14px;background:var(--sand);border-radius:3px 3px 0 0}
.logo-column .shaft{width:44px;height:76px;margin:0 auto;background:repeating-linear-gradient(90deg,var(--sand) 0 6px,transparent 6px 11px);opacity:.92}
.logo-column .base{width:64px;height:14px;background:var(--sand);clip-path:polygon(8% 100%,92% 100%,100% 0,0 0)}
.asset-note{font-size:.68rem;color:var(--gold);opacity:.85;margin-top:10px;font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}

/* بطاقات الركائز الثلاث */
.pillar-card{border-radius:16px;padding:26px 24px;border:1px solid var(--line);position:relative;overflow:hidden}
.pillar-card .p-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-family:'IBM Plex Mono';font-weight:700;font-size:1.05rem;color:var(--navy)}
.pillar-card h3{font-family:'Thmanyah Serif Text';font-weight:600;font-size:1.15rem;margin-bottom:8px;color:var(--sand)}
.pillar-card p{font-size:.87rem;color:var(--mist);font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.comp-row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.comp-chip{background:var(--stone2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:.85rem;color:var(--sand);font-family:'IBM Plex Sans Arabic';font-weight:500;display:flex;align-items:center;gap:6px}
.comp-chip .tag{font-size:.68rem;color:var(--mist);font-weight:400}
.comp-label{font-size:.78rem;color:var(--gold);font-weight:600;margin-bottom:4px;font-family:'Thmanyah Serif Text'}
.mini-chart{margin-top:22px}
.mini-chart svg{width:100%;height:auto;display:block}
.mini-chart .bar-label{font-family:'IBM Plex Mono';font-size:11px;fill:var(--mist)}
.mini-chart .bar-value{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;fill:var(--gold)}
.mini-chart .axis-label{font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic';font-size:11px;fill:var(--mist)}
.team-row{display:flex;gap:36px;margin-top:26px}
.team-member{display:flex;flex-direction:column;align-items:center;gap:8px}
.team-member img{width:76px;height:76px;display:block}
.team-member span{font-size:.8rem;color:var(--sand);font-family:'Thmanyah Serif Text','IBM Plex Sans Arabic'}
.partner-row{margin-top:28px;display:flex;align-items:center;gap:34px;padding:18px 30px;background:var(--stone);border:1px solid var(--line);border-radius:14px}
.partner-row img{display:block;width:auto}
.pillar-card.violet{background:linear-gradient(180deg,rgba(109,78,158,.20),var(--stone));border-color:var(--violet)}
.pillar-card.violet .p-icon{background:var(--violet-surface);color:var(--violet)}
.pillar-card.pulse{background:linear-gradient(180deg,rgba(23,195,178,.10),var(--stone));border-color:var(--pulse)}
.pillar-card.pulse .p-icon{background:var(--pulse)}
.pillar-card.clay{background:linear-gradient(180deg,rgba(181,88,58,.16),var(--stone));border-color:var(--clay)}
.pillar-card.clay .p-icon{background:var(--clay);color:var(--sand)}

@media(max-width:640px){.frame{padding:34px}.frame h2{font-size:1.6rem}#f-core h1{font-size:2.6rem}.trio{flex-direction:column;gap:16px}.risk-grid{grid-template-columns:1fr}#dots{display:none}}
</style>
</head>
